name: Refresh public records snapshot
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest -v
      - uses: actions/configure-pages@v5
      - name: Fetch public data and render static pages
        run: python3 export.py
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          path: _site
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Delete temporary data artifact after deployment
        if: always() && steps.upload.outputs.artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
  maintenance:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Monthly maintenance to keep scheduled refreshes active
        shell: bash
        run: |
          month="$(date -u +%Y-%m)"
          if [ "$(cat .last-maintenance 2>/dev/null || true)" = "$month" ]; then exit 0; fi
          printf '%s\n' "$month" > .last-maintenance
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .last-maintenance
          git commit -m 'Maintain scheduled snapshot publishing'
          git push
